# markdownlint configuration for MkDocs Material documentation

# MD013: Line length (irrelevant for documentation and long URLs)
MD013: false

# MD033: Inline HTML (required for MkDocs Material grid cards, spans, etc.)
MD033:
  allowed_elements:
    - div
    - span
    - a

# MD004: Unordered list style
MD004: false

# MD007: Unordered list indentation
MD007: false

# MD029: Ordered list item prefix
MD029: false

# MD030: Spaces after list markers (MkDocs Material cards often use 3 spaces)
MD030: false

# MD046: Code block style (admonitions often use indentations)
MD046: false

# MD050: Strong style (* vs _)
MD050: false
